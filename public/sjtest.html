<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SJ test</title>
<style>
        body { font-family: system-ui; background: #111; color: #eee; padding: 20px; display: flex; flex-direction: column; gap: 12px; height: 95vh; box-sizing: border-box; }
        iframe { flex: 1; width: 100%; background: #fff; border: 1px solid #444; border-radius: 8px; }
        .row { display: flex; gap: 8px; }
        input, button, select { font-size: 14px; padding: 8px; border-radius: 6px; border: 1px solid #555; background: #222; color: #eee; }
        button { cursor: pointer; }
        #log { font-size: 11px; font-family: monospace; color: #9f9; white-space: pre-wrap; max-height: 140px; overflow: auto; background: #000; padding: 8px; border-radius: 6px; }
        #status { font-weight: 600; }
</style>
</head>
<body>
        <div class="row">
                <input id="addr" style="flex:1" placeholder="https://example.com" value="https://example.com" />
                <button id="go">Ir</button>
                <button id="back">◀</button>
                <button id="fwd">▶</button>
                <button id="reload">⟳</button>
        </div>
        <div class="row">
                <label>wisp: <input id="wisp" style="width:360px" value="ws://localhost:3001/" /></label>
                <button id="setwisp">Aplicar wisp</button>
                <span id="status">…</span>
        </div>
        <iframe id="frame" style="border:0"></iframe>
        <div id="log"></div>

<script src="/scram/scramjet.all.js"></script>
<script src="/baremux/index.js"></script>
<script>
const log = (...a) => { document.getElementById('log').textContent += a.join(' ') + "\n"; };
const status = (s) => { document.getElementById('status').textContent = s; };
const qs = new URLSearchParams(location.search);
if (qs.get('wisp')) document.getElementById('wisp').value = qs.get('wisp');

let connection, scramjet, sf;

function base() {
        // '' en raíz, '/aos' en GitHub Pages; soporta rutas con o sin archivo final
        const p = location.pathname.replace(/\/+$/, '');
        if (!p) return '';
        const seg = p.slice(p.lastIndexOf('/') + 1);
        if (seg.includes('.')) return p.slice(0, p.lastIndexOf('/'));
        return p;
}

async function boot() {
        status('init controller…');
        const b = base();
        const { ScramjetController } = $scramjetLoadController();
        scramjet = new ScramjetController({
                prefix: b + '/scramjet/',
                files: {
                        wasm: b + '/scram/scramjet.wasm.wasm',
                        all: b + '/scram/scramjet.all.js',
                        sync: b + '/scram/scramjet.sync.js',
                },
        });
        await scramjet.init();

        status('registrando SW…');
        await navigator.serviceWorker.register('/sw.js');
        await navigator.serviceWorker.ready;
        status('SW listo.');
        connection = new BareMux.BareMuxConnection(b + '/baremux/worker.js');
        await applyWisp(document.getElementById('wisp').value);

        sf = scramjet.createFrame(document.getElementById('frame'));
        sf.addEventListener('urlchange', (e) => { log('[urlchange]', e.url); document.getElementById('addr').value = e.url; });
        sf.addEventListener('navigate', (e) => log('[navigate]', e.url));
        scramjet.addEventListener('download', (e) => log('[download]', e.download.filename || e.download.url));
        status('motor listo');
}

async function applyWisp(wispUrl) {
        await connection.setTransport(base() + '/libcurl/index.mjs', [{ websocket: wispUrl }]);
        log('[wisp] transporte =', wispUrl);
}

document.getElementById('go').onclick = () => sf.go(document.getElementById('addr').value);
document.getElementById('setwisp').onclick = async () => { await applyWisp(document.getElementById('wisp').value); sf.reload(); };
document.getElementById('back').onclick = () => sf.back();
document.getElementById('fwd').onclick = () => sf.forward();
document.getElementById('reload').onclick = () => sf.reload();
document.getElementById('addr').addEventListener('keydown', (e) => { if (e.key === 'Enter') sf.go(e.target.value); });

boot().catch((e) => { status('ERROR'); log('[fatal]', String(e), e.stack || ''); });
</script>
</body>
</html>
