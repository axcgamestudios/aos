<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prueba de inicio de sesión</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(160deg, #f8fafc, #eef2f7); margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #1f2937; }
  .card { background: #fff; border-radius: 18px; box-shadow: 0 12px 40px rgba(15,23,42,.12); padding: 34px 36px; width: min(92vw, 380px); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 22px; font-size: 12.5px; color: #6b7280; }
  label { display: block; font-size: 11.5px; font-weight: 600; color: #374151; margin: 12px 0 4px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 14px; outline: none; }
  input:focus { border-color: #14b8a6; box-shadow: 0 0 0 3px rgba(20,184,166,.18); }
  button { margin-top: 22px; width: 100%; padding: 11px; border: 0; border-radius: 10px; background: #0f766e; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:hover { background: #115e59; }
  .ok { display: none; margin-top: 16px; padding: 10px 12px; border-radius: 10px; background: #ecfdf5; color: #065f46; font-size: 12.5px; }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; color: #0f766e; font-weight: 700; font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #14b8a6; }
</style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="on">
    <div class="brand"><span class="dot"></span> Intranet de prueba</div>
    <h1>Iniciar sesión</h1>
    <p class="sub">Página de prueba del autocompletado de axcsOS (correo verificado + bóveda de contraseñas).</p>
    <label for="email">Correo electrónico</label>
    <input id="email" name="email" type="email" placeholder="tu correo" autocomplete="email" required />
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" placeholder="tu contraseña" autocomplete="current-password" required />
    <button type="submit">Entrar</button>
    <div class="ok" id="ok">Formulario enviado: axcsOS debería haberte ofrecido guardar la contraseña.</div>
  </form>
  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      document.getElementById("ok").style.display = "block";
    });
  </script>
</body>
</html>
